name: readiness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: maher-bounty doctor

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - run: |
          python -m unittest discover -s tests -p test_browser_runtime.py -v
          python -m unittest discover -s tests -p test_browser_xss.py -v
          python -m unittest discover -s tests -p test_multi_identity_workflows.py -v
          python -m unittest discover -s tests -p test_local_proxy.py -v
          python -m unittest discover -s tests -p test_workflow_benchmark_live.py -v
        env:
          MAHER_BROWSER_TESTS: "1"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path engine/rust-core/Cargo.toml

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - run: cd engine/go-core && go build ./...

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: analyzers/js-ts/package.json
      - run: cd analyzers/js-ts && npm install
      - run: cd analyzers/js-ts && npm run check
      - run: cd analyzers/js-ts && npm run --silent analyze -- fixtures > /tmp/js-analysis.json
      - run: node -e "const x=require('/tmp/js-analysis.json'); if(x.function_count<2) process.exit(1); if(!x.route_handlers.some(r=>r.path==='/users/:id')) process.exit(2); if(!x.call_edges.some(e=>e.callee==='loadUser')) process.exit(3);"

  ecosystem-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: java -version
      - run: dotnet --info
      - run: php --version
      - run: ruby --version
      - run: gcc --version && g++ --version
